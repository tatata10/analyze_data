<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>縦に並んだボタン</title>
    <style>
        /* 全体のスタイル */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        .container {
            margin: 50px auto;
            padding: 20px;
            max-width: 300px;
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        h1 {
            color: #333;
        }

        /* ボタンのスタイル */
        .button {
            display: block; /* 縦に並べる */
            width: 100%; /* ボタンの横幅を揃える */
            padding: 15px 20px;
            margin: 10px 0;
            font-size: 18px; /* ボタンを大きく */
            color: #fff;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .button:hover {
            background-color: #0056b3;
            transform: scale(1.05); /* 少し大きくなるアニメーション */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>home</h1>
        <button class="button" onclick="location.href='./index'">データ収集</button>
        <button class="button" onclick="location.href='./regist_storename'">データ登録</button>
        <button class="button" onclick="location.href='./form'">データ登録②</button>
        <button class="button" onclick="location.href='./study'">Page 4</button>
    </div>
</body>
</html>
